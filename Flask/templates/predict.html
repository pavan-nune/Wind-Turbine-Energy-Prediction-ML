<!DOCTYPE html>
<html>
<head>
    <title>Energy Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body style="background-image: url('{{ url_for('static', filename='bg-predict.jpg') }}');">

<div class="center" style="min-height:100vh;">
    <div class="glass" style="width:420px;">
        <h2>⚡ Wind Energy Prediction</h2>

        <form action="/predict" method="post">
            <input type="number" step="0.01" name="wind_speed" placeholder="Wind Speed (m/s)" required>
            <input type="number" step="0.01" name="theoretical_power" placeholder="Theoretical Power (kW)" required>
            <input type="number" step="0.01" name="wind_direction" placeholder="Wind Direction (°)" required>

            <button class="btn">Predict Energy</button>
        </form>

        {% if prediction %}
        <div style="margin-top:20px; font-size:18px;">
            🔋 Predicted Energy Output:<br>
            <b>{{ prediction }} kW</b>
        </div>
        {% endif %}

        <div style="margin-top:20px;">
            <a href="/">← Back to Home</a>
        </div>
    </div>
</div>

</body>
</html>
